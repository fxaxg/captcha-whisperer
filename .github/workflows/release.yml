name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build the wheel and the sdist
        run: uv build

      - name: Check the metadata and the README render
        run: uvx twine check dist/*

      - name: Upload the distributions
        uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/

  # A tag such as v0.1.0rc1 or v0.2.0b1 goes here, so an upload can be rehearsed
  # without touching the real index.
  testpypi:
    needs: build
    if: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'a') || contains(github.ref_name, 'b') }}
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Publish to TestPyPI
        run: uv publish --publish-url https://test.pypi.org/legacy/

  # A final tag such as v0.1.0 or v1.2.3 goes here.
  #
  # This is deliberately independent of the TestPyPI job rather than chained
  # after it: a version can only be uploaded once per index, so a rehearsal
  # upload of the same version number would block the real release.
  pypi:
    needs: build
    if: ${{ !contains(github.ref_name, 'rc') && !contains(github.ref_name, 'a') && !contains(github.ref_name, 'b') }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Publish to PyPI
        run: uv publish --publish-url https://upload.pypi.org/legacy/
